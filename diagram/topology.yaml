# Diagram-as-code source for images/topology-logos.png
#
# Identical to topology.yaml except for two things:
#   * the two appliances use their vendor logomarks instead of the generic
#     compute icon (see the note on icons below);
#   * the Azure VNet is labelled by its CIDR only.
#
# Rendered with awslabs/diagram-as-code (awsdac), then fitted to 1920x1080
# without distorting the drawing:
#   convert images/topology-logos.png -resize 1920x1080 \
#           -background white -gravity center -extent 1920x1080 \
#           images/topology-logos.png
#
# ICON PATHS ARE ABSOLUTE, and that is not cosmetic. The renderer resolves an
# Icon path against ITS OWN working directory, not against the location of this
# file - a relative path fails with "no such file or directory" even when the
# file is plainly there. Adjust the two Icon lines below to wherever this
# repository is checked out before regenerating.
#
# Use the LOGOMARK, not the full wordmark. Both vendors' logos are wide
# horizontal lockups, and the icon slot is small and square: a wordmark scaled
# into it becomes an unreadable smudge. Cropping the square symbol out of the
# logo keeps it legible, and the resource Title underneath already carries the
# product name.
#
# Icons in diagram/icons/ were cropped from the vendor logos on Wikimedia
# Commons, padded to square with a transparent background.

Diagram:
  DefinitionFiles:
    - Type: URL
      Url: https://raw.githubusercontent.com/awslabs/diagram-as-code/main/definitions/definition-for-aws-icons-light.yaml

  Links:
    - Source: CHR
      SourcePosition: E
      Target: TunnelBox
      TargetPosition: W
      Type: orthogonal
      SourceArrowHead:
        Type: Open
      TargetArrowHead:
        Type: Open
    - Source: TunnelBox
      SourcePosition: E
      Target: PFSense
      TargetPosition: W
      Type: orthogonal
      SourceArrowHead:
        Type: Open
      TargetArrowHead:
        Type: Open

  Resources:
    Canvas:
      Type: AWS::Diagram::Canvas
      Direction: vertical
      Children:
        - Clouds

    Clouds:
      Type: AWS::Diagram::HorizontalStack
      Align: center
      Children:
        - AlibabaCloud
        - TunnelBox
        - AzureCloud

    TunnelBox:
      Type: AWS::Diagram::Resource
      Preset: "Generic group"
      Title: "Site-to-site tunnel"
      Direction: vertical
      Children:
        - TunnelL1
        - TunnelL2
        - TunnelL3
        - TunnelL4

    TunnelL1:
      Type: AWS::Diagram::Resource
      Title: "IPsec IKEv2 + NAT-T"
    TunnelL2:
      Type: AWS::Diagram::Resource
      Title: "UDP 500 / 4500"
    TunnelL3:
      Type: AWS::Diagram::Resource
      Title: "GRE 169.254.100.0/30"
    TunnelL4:
      Type: AWS::Diagram::Resource
      Title: "eBGP 64513 - 64512"

    AlibabaCloud:
      Type: AWS::Diagram::Cloud
      Preset: AWSCloudNoLogo
      Title: "Alibaba Cloud   ap-southeast-5"
      Children:
        - VPCAli

    VPCAli:
      Type: AWS::EC2::VPC
      Title: "VPC   10.151.64.0/18"
      Direction: vertical
      Children:
        - AliSubnets

    AliSubnets:
      Type: AWS::Diagram::VerticalStack
      Children:
        - AliPublicSubnet
        - AliPrivateSubnet

    AliPublicSubnet:
      Type: AWS::EC2::Subnet
      Preset: PublicSubnet
      Title: "vSwitch public   10.151.64.0/24"
      Children:
        - CHRStack

    CHRStack:
      Type: AWS::Diagram::VerticalStack
      Children:
        - CHR
        - CHRIf1
        - CHRIf2

    CHR:
      Type: AWS::Diagram::Resource
      Icon: /home/me/ai-ops/repo/cloud-chr-pfsense-ipsec-bgp/diagram/icons/mikrotik.png
      Title: "MikroTik CHR"
    CHRIf1:
      Type: AWS::Diagram::Resource
      Title: "ether1  10.151.64.84"
    CHRIf2:
      Type: AWS::Diagram::Resource
      Title: "ether2  10.151.74.239   EIP 147.139.142.199"

    AliPrivateSubnet:
      Type: AWS::EC2::Subnet
      Preset: PrivateSubnet
      Title: "vSwitch private   10.151.74.0/24"
      Children:
        - MasterStack

    MasterStack:
      Type: AWS::Diagram::VerticalStack
      Children:
        - K8sMaster
        - MasterIP

    K8sMaster:
      Type: AWS::EC2::Instance
      Title: "k8s-master   control plane"
    MasterIP:
      Type: AWS::Diagram::Resource
      Title: "10.151.74.240"

    AzureCloud:
      Type: AWS::Diagram::Cloud
      Preset: AWSCloudNoLogo
      Title: "Azure   Indonesia Central"
      Children:
        - VNetAzure

    VNetAzure:
      Type: AWS::EC2::VPC
      Title: "VNet   10.126.64.0/18"
      Direction: vertical
      Children:
        - AzureSubnets

    AzureSubnets:
      Type: AWS::Diagram::VerticalStack
      Children:
        - AzurePublicSubnet
        - AzurePrivateSubnet

    AzurePublicSubnet:
      Type: AWS::EC2::Subnet
      Preset: PublicSubnet
      Title: "subnet-public   10.126.64.0/26"
      Children:
        - PFStack

    PFStack:
      Type: AWS::Diagram::VerticalStack
      Children:
        - PFSense
        - PFIf1
        - PFIf2

    PFSense:
      Type: AWS::Diagram::Resource
      Icon: /home/me/ai-ops/repo/cloud-chr-pfsense-ipsec-bgp/diagram/icons/pfsense.png
      Title: "pfSense Plus"
    PFIf1:
      Type: AWS::Diagram::Resource
      Title: "hn0  10.126.64.4"
    PFIf2:
      Type: AWS::Diagram::Resource
      Title: "hn1  10.126.65.4   PIP 48.193.46.116"

    AzurePrivateSubnet:
      Type: AWS::EC2::Subnet
      Preset: PrivateSubnet
      Title: "subnet-private   10.126.65.0/24"
      Children:
        - WorkerStack

    WorkerStack:
      Type: AWS::Diagram::VerticalStack
      Children:
        - K8sWorker
        - WorkerIP

    K8sWorker:
      Type: AWS::EC2::Instance
      Title: "k8s-worker"
    WorkerIP:
      Type: AWS::Diagram::Resource
      Title: "10.126.65.5"
